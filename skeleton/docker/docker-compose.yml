services:
    web:
      image: php:8.4-apache
      container_name: ProduShop
      build:
          context: .
          dockerfile: dockerfile
      environment:
          - MYSQL_USER=admin
          - MYSQL_PASSWORD=64ra97!
          - MYSQL_DATABASE=ProduShop-db
      ports:
          - "8084:80"
      volumes:
          - ./../:/var/www/html
      #    - ./000-default.conf:/etc/apache2/sites-available/000-default.conf
      # command: sh -c "a2enmod rewrite && docker-php-ext-install pdo pdo_mysql && apache2-foreground"
      depends_on:
          - mysql
      dns:
        - 8.8.8.8
        - 1.1.1.1

    mysql:
      image: mysql:8
      container_name: ProduShop-database
      ports:
          - "8039:3306"
      working_dir: /application
      platform: linux/amd64
      environment:
          - MYSQL_USER=admin
          - MYSQL_PASSWORD=64ra97!
          - MYSQL_DATABASE=ProduShop-db
          - MYSQL_ROOT_PASSWORD=64ra97!
    
    phpmyadmin:
      image: phpmyadmin/phpmyadmin:latest
      restart: always
      depends_on:
        - mysql
      environment:
        PMA_HOST: mysql
        MYSQL_ROOT_PASSWORD: 64ra97!
      ports:
        - "8089:80"

networks:
  default:
    name: portainer_network